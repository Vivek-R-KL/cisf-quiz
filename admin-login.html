<!DOCTYPE html>
<html lang="en">
<head>
    <script>
  // 1. Disable Right-Click
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  }, false);

  // 2. Disable Keyboard Shortcuts (F12, Ctrl+U, etc.)
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || 
       (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'i' || e.key === 'j'))) {
      e.preventDefault();
    }
  });

  // 3. Prevent Multiple Tabs Detection
  const QUIZ_KEY = "my_active_quiz_session";
  if (localStorage.getItem(QUIZ_KEY)) {
      alert("This quiz is already open in another tab. This window will now close.");
      window.close();
      // Fallback if window.close() is blocked
      window.location.href = "about:blank";
  } else {
      localStorage.setItem(QUIZ_KEY, "true");
      window.addEventListener("beforeunload", () => localStorage.removeItem(QUIZ_KEY));
  }
</script>
    <meta charset="UTF-8">
    <title>Admin Login - CISF ASTI DELHI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .loading-spinner { display: none; color: #328cc1; font-size: 13px; font-weight: bold; margin-top: 10px; text-align: center; }
        /* Style for read-only state */
        input[readonly] { background-color: #f9f9f9; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>CISF ASTI DELHI EXAM PORTAL</h1>
    </header>

    <div class="portal-container" style="max-width: 450px; margin-top: 60px;">
        <h2 style="text-align: center; color: #0b3c5d;">Admin Authentication Gateway</h2>
        <hr><br>

        <div id="credentialSection">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" id="admUser" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');">
            </div>
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="admPass" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
            </div>
            <button style="width: 100%;" id="otpBtn" onclick="requestOTP()">Request Secure OTP</button>
            <div id="loadingStatus" class="loading-spinner">📡 Connecting to Mail Server... Please wait.</div>
        </div>

        <div id="otpSection" style="display: none;">
            <div style="background: #e2f0fd; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px;">
                🔐 System Security alert: A dynamic real-time OTP has been routed to admin's mail id.
            </div>
            <div class="form-group">
                <label>Enter 6-Digit OTP</label>
                <input type="text" id="otpInput" placeholder="------" style="text-align: center; font-size: 18px; letter-spacing: 5px;">
            </div>
            <button style="width: 100%; background-color: #2ecc71; color: white;" onclick="verifyOTP()">Secure Login</button>
        </div>
    </div>

    <footer>
        created and developed by Vivek R ,ALL RIGHTS RESERVED 2026
    </footer>

    <script>
        // Same Apps Script as admin-dashboard.html (the secured code.gs).
        // Username, password and OTP are all checked on the SERVER now -
        // nothing secret is written in this page.
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwq0k5tJyXXus0Nvd9ZpVOBzaJHxQdGPDSckrk6MCmHcdv8OiPxF7B0ZhBBQ6lk8wQU/exec";

        async function callServer(data) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(data)
            });
            return await res.json();
        }

        async function requestOTP() {
            const u = document.getElementById('admUser').value.trim();
            const p = document.getElementById('admPass').value;
            if (!u || !p) { alert("Enter username and password."); return; }

            document.getElementById('loadingStatus').style.display = "block";
            document.getElementById('otpBtn').disabled = true;
            try {
                const r = await callServer({ action: "requestAdminOtp", username: u, password: p });
                if (r.status === "success") {
                    document.getElementById('credentialSection').style.display = 'none';
                    document.getElementById('otpSection').style.display = 'block';
                    document.getElementById('otpInput').focus();
                } else {
                    alert(r.message || "Login failed.");
                }
            } catch (err) {
                alert("Could not reach the server. Please try again.");
            } finally {
                document.getElementById('loadingStatus').style.display = "none";
                document.getElementById('otpBtn').disabled = false;
                document.getElementById('admPass').value = "";
            }
        }

        async function verifyOTP() {
            const entered = document.getElementById('otpInput').value.trim();
            if (!/^\d{6}$/.test(entered)) { alert("Enter the 6-digit code."); return; }
            try {
                const r = await callServer({ action: "verifyAdminOtp", otp: entered });
                if (r.status === "success" && r.adminToken) {
                    sessionStorage.setItem('adminToken', r.adminToken);
                    window.location.href = "admin-dashboard.html";
                } else {
                    alert(r.message || "Invalid OTP code entry.");
                    if (r.message && r.message.indexOf("request a new") !== -1) location.reload();
                }
            } catch (err) {
                alert("Could not reach the server. Please try again.");
            }
        }
    </script>
</body>
</html>
